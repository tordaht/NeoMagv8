name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint runs with rules that can actually fail. The previous config had an
      # empty rule set, so `npm run lint` passed on undefined identifiers and
      # duplicate declarations alike.
      - run: npm run lint
      - run: npm run typecheck

      # Unit and regression tests, including the ecology stability invariant and
      # the "utterances are not a fixed list" check.
      - run: npm run test

      - run: npm run build

      # Drives the built page in a real browser and fails on a single console
      # error or failed request.
      - run: npx playwright install --with-deps chromium
      - run: npx tsx tests/smoke.ts

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: dist/smoke.png
          if-no-files-found: ignore

  experiment:
    # The paired A/B run that reports whether the comprehension model actually
    # helps. Kept off pull requests because it is minutes, not seconds.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx tools/experiment.ts --seeds 6 --seconds 600 --out experiment.json
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiment.json
