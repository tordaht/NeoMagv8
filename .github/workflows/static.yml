name: Deploy to GitHub Pages

# The only Pages workflow. Two used to race on this concurrency group — one
# uploading the whole repository, one running Jekyll over it — so which build
# actually shipped was undefined.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Only the built bundle is published; `base: './'` in vite.config.ts
          # keeps the asset paths correct under a project subpath.
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
